name: macOS quality
on:
  push:
  pull_request:
jobs:
  test:
    # Xcode 27 requires the dedicated macOS 27 image (currently public preview).
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d "$DEVELOPER_DIR" ]]; then
            echo "::error::Xcode 27.1 is missing at $DEVELOPER_DIR"
            exit 1
          fi
          actual_version="$(xcodebuild -version)"
          printf '%s\n' "$actual_version"
          if [[ "$actual_version" != $'Xcode 27.1\nBuild version 27A9275' ]]; then
            echo "::error::Expected Xcode 27.1 (27A9275); update the CI pin explicitly."
            exit 1
          fi
          swift --version
      - name: Unit and scenario tests
        run: swift test --enable-code-coverage
      - name: Build application bundle
        run: ./scripts/build-app.sh
